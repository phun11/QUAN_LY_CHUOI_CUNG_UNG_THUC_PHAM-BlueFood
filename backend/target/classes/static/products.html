<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HoneyBee Trace - Lô hàng & QR</title>
  <link rel="stylesheet" href="css/honeybee.css" />
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F6B93B">
  <link rel="apple-touch-icon" href="assets/icon-192.png">

<body>
<header class="hb-header">
  <div class="hb-shell hb-header-inner">
    <a class="hb-brand" href="index.html"><span class="hb-logo">🐝</span><span>HoneyBee Trace<small>Lô hàng, QR và truy xuất</small></span></a>

<main class="hb-shell" style="padding:24px 0 36px">

      Dữ liệu lấy trực tiếp từ H2 database qua API <b>/api/system/qr-codes</b>.

  <section id="products" class="hb-grid" style="margin-top:16px"></section>

<script src="js/api.js"></script>
