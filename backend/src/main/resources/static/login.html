<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập HoneyBee</title>
  <link rel="stylesheet" href="css/honeybee.css" />
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F6B93B">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
</head>
<body>
  <main class="hb-mobile-shell" style="padding:38px 0">
    <section class="hb-card">
      <div class="hb-brand" style="justify-content:center;margin-bottom:18px"><span class="hb-logo">🐝</span><span>HoneyBee Trace<small>Đăng nhập hệ thống vận hành</small></span></div>
      <label>Tên đăng nhập</label>
      <input id="username" class="hb-input" value="admin" />
      <label style="margin-top:12px">Mật khẩu</label>
      <input id="password" class="hb-input" type="password" value="admin123" />
      <button id="login-btn" class="hb-btn full" style="margin-top:16px">Đăng nhập</button>
      <p id="login-msg" style="color:var(--hb-muted)">Demo: admin/admin123, farm1/123456, transport1/123456, store1/123456</p>
    </section>
  </main>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
