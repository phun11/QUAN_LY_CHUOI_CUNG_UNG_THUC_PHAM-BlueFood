# ============================================================
# HoneyBee Trace - Oracle version
# ============================================================
# Trước khi chạy backend, tạo user/schema Oracle rồi chạy:
# database/oracle/09_all_in_one.sql
# Sau đó sửa username/password/url bên dưới cho khớp máy của bạn.
# ============================================================
server.port=8080
server.address=0.0.0.0
spring.application.name=honeybee-trace-oracle

spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=HONEYBEE
spring.datasource.password=123456

# Oracle dùng script SQL chạy thủ công, không để Spring tự tạo schema.
spring.sql.init.mode=never
spring.h2.console.enabled=false

app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:8080}
app.qr.secret=HoneyBee-Trace-Demo-Secret-2026

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
