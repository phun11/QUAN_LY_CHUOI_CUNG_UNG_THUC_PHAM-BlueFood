# ============================================================
# HoneyBee Trace - H2 quick test version
# ============================================================
# Bản này chạy nhanh, không cần cài Oracle. Spring Boot tự nạp schema/data H2.
# ============================================================
server.port=8080
server.address=0.0.0.0
spring.application.name=honeybee-trace-h2

spring.datasource.url=jdbc:h2:mem:agritrace;MODE=Oracle;DATABASE_TO_UPPER=true;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:h2/schema-h2.sql
spring.sql.init.data-locations=classpath:h2/data-h2.sql
spring.sql.init.encoding=UTF-8
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:8080}
app.qr.secret=HoneyBee-Trace-Demo-Secret-2026

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
